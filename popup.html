<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Mode</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="icon">🌙</span>
      <span class="title">Media-Safe Dark Mode</span>
    </div>
    <span id="status-badge" class="badge">OFF</span>
  </header>

  <main>
    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">Global</span>
        <span class="toggle-sub">Enable for all sites</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="global-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">This site</span>
        <span class="toggle-sub" id="hostname-label">—</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="site-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <p class="hint" id="hint-text"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
